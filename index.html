<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine 💘</title>
  <style>
    :root{
      --bg1:#ffdde1; --bg2:#ee9ca7; --card:#ffffffcc; --txt:#1f1f1f;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background: linear-gradient(135deg,var(--bg1),var(--bg2));
      overflow:hidden;
    }
    .card{
      width:min(520px,92vw);
      background:var(--card);
      backdrop-filter: blur(8px);
      border-radius:24px;
      padding:28px 22px;
      box-shadow: 0 18px 50px rgba(0,0,0,.18);
      text-align:center;
      position:relative;
    }
    h1{margin:0 0 10px; font-size:26px; color:var(--txt)}
    p{margin:0 0 18px; color:#333; opacity:.9}
    .btns{display:flex; gap:12px; justify-content:center; margin-top:10px}
    button{
      border:0; border-radius:999px;
      padding:12px 20px; font-size:16px; cursor:pointer;
      transition: transform .08s ease;
    }
    button:active{transform:scale(.98)}
    #yes{background:#16a34a; color:white}
    #no{
      background:#ef4444; color:white;
      position:absolute; /* so it can run away */
      left:50%; top:72%;
      transform: translate(-50%,-50%);
    }
    .msg{
      display:none;
      margin-top:18px;
      padding:14px 14px;
      background:white;
      border-radius:16px;
      border: 1px solid rgba(0,0,0,.08);
      font-size:16px;
    }
    .hearts{
      position:fixed; inset:0; pointer-events:none; overflow:hidden;
    }
    .heart{
      position:absolute; bottom:-30px;
      font-size:18px; opacity:.85;
      animation: floatUp linear forwards;
    }
    @keyframes floatUp{
      to{ transform: translateY(-110vh) rotate(20deg); opacity:0; }
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <div class="card" id="card">
    <h1>Will you be my Valentine, my babyboo? 💘</h1>
    <p>Choose wisely 😌</p>

    <div class="btns">
      <button id="yes">Yes 😍</button>
    </div>

    <!-- "No" is positioned absolutely so it can move -->
    <button id="no" aria-label="No">No 🙈</button>

    <div class="msg" id="msg">
      Yayyyy! 🥰💞 <br/>
      I’m taking you on a cute date. 🌷✨
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("msg");
    const card = document.getElementById("card");
    const hearts = document.getElementById("hearts");

    function moveNoButton() {
      const padding = 10;
      const cardRect = card.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // Limit movement inside the card area (so it doesn't go off-screen)
      const minX = padding;
      const maxX = cardRect.width - btnRect.width - padding;
      const minY = 90; // keep it below the title area
      const maxY = cardRect.height - btnRect.height - padding;

      const x = Math.random() * (maxX - minX) + minX;
      const y = Math.random() * (maxY - minY) + minY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.transform = "translate(0,0)";
    }

    // Run away on hover (desktop) and on touch (mobile)
    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNoButton();
    }, { passive:false });

    // If she somehow clicks it, still move it
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      moveNoButton();
    });

    function popHearts() {
      for (let i=0; i<18; i++){
        const el = document.createElement("div");
        el.className = "heart";
        el.textContent = ["💖","💘","💞","💕","❤️"][Math.floor(Math.random()*5)];
        el.style.left = Math.random()*100 + "vw";
        el.style.animationDuration = (2 + Math.random()*2.5) + "s";
        el.style.fontSize = (16 + Math.random()*18) + "px";
        hearts.appendChild(el);
        setTimeout(()=> el.remove(), 5000);
      }
    }

    yesBtn.addEventListener("click", () => {
      msg.style.display = "block";
      noBtn.style.display = "none";
      yesBtn.textContent = "Yesss 💚";
      popHearts();
    });

    // Put No somewhere nice initially
    moveNoButton();
  </script>
</body>
</html>
