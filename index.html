<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Babyboo 💘</title>
  <style>
    :root{
      --bg1:#ffdde1; --bg2:#ee9ca7; --card:#ffffffcc; --txt:#1f1f1f;
      --shadow: 0 18px 50px rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background: linear-gradient(135deg,var(--bg1),var(--bg2));
      overflow:hidden;
    }
    .card{
      width:min(680px,92vw);
      background:var(--card);
      backdrop-filter: blur(8px);
      border-radius:26px;
      padding:34px 22px 34px;
      box-shadow: var(--shadow);
      text-align:center;
      position:relative;
    }
    h1{margin:0 0 10px; font-size:30px; color:var(--txt)}
    p{margin:0 0 18px; color:#333; opacity:.9}

    /* Buttons side-by-side */
    .btnRow{
      display:flex;
      gap:14px;
      justify-content:center;
      align-items:center;
      margin-top:10px;
      flex-wrap:wrap;
    }
    button{
      border:0; border-radius:999px;
      padding:12px 22px; font-size:16px; cursor:pointer;
      transition: transform .08s ease, filter .2s ease;
      user-select:none;
      min-width:140px;
    }
    button:hover{filter:brightness(1.02)}
    button:active{transform:scale(.98)}
    #yes{background:#16a34a; color:white}
    #no{
      background:#ef4444; color:white;
      position:relative; /* stays in row but can “dodge” */
      left:0; top:0;
    }

    /* Message popup */
    .msg{
      display:none;
      margin-top:22px;
      padding:18px 16px;
      background:white;
      border-radius:18px;
      border: 1px solid rgba(0,0,0,.10);
      font-size:16px;
      line-height:1.45;
      box-shadow: 0 10px 30px rgba(0,0,0,.10);
      transform-origin: center;
    }

    /* When shown, animate */
    .msg.show{
      display:block;
      animation: popIn .65s cubic-bezier(.2,1.2,.2,1) both;
    }

    /* Soft glow behind message */
    .glow{
      position:absolute;
      left:50%;
      top:74%;
      width:min(520px,85vw);
      height:160px;
      transform:translateX(-50%);
      background: radial-gradient(circle at center, rgba(255,255,255,.85), rgba(255,255,255,0));
      filter: blur(10px);
      opacity:0;
      pointer-events:none;
    }
    .glow.show{
      opacity:1;
      animation: glowIn .75s ease both;
    }

    @keyframes popIn{
      0%   {opacity:0; transform: translateY(10px) scale(.92);}
      55%  {opacity:1; transform: translateY(0) scale(1.05);}
      100% {opacity:1; transform: translateY(0) scale(1);}
    }
    @keyframes glowIn{
      0%   {opacity:0; transform:translateX(-50%) scale(.9);}
      100% {opacity:1; transform:translateX(-50%) scale(1);}
    }

    /* Floating hearts */
    .hearts{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }
    .heart{
      position:absolute; bottom:-30px;
      font-size:18px; opacity:.85;
      animation: floatUp linear forwards;
    }
    @keyframes floatUp{
      to{ transform: translateY(-110vh) rotate(20deg); opacity:0; }
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <div class="card" id="card">
    <h1>Will you be my Valentine, my babyboo? 💘</h1>
    <p>Choose wisely 😌</p>

    <div class="btnRow">
      <button id="yes">Yesss 💚</button>
      <button id="no">No 🙈</button>
    </div>

    <div class="glow" id="glow"></div>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    const card   = document.getElementById("card");
    const noBtn  = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg    = document.getElementById("msg");
    const glow   = document.getElementById("glow");
    const hearts = document.getElementById("hearts");

    function dodgeNo(){
      const cardRect = card.getBoundingClientRect();
      const btnRect  = noBtn.getBoundingClientRect();

      // Controlled movement so it stays within the card area
      const maxX = Math.max(0, (cardRect.width / 2) - btnRect.width - 30);
      const maxY = 70;

      const x = (Math.random() * (maxX * 2)) - maxX;
      const y = (Math.random() * (maxY * 2)) - maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    }

    // Desktop: runs away only when you try to hover it
    noBtn.addEventListener("mouseenter", dodgeNo);

    // Mobile: runs away on tap
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      dodgeNo();
    }, { passive:false });

    // If clicked somehow, still dodge
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      dodgeNo();
    });

    function popHearts(){
      for(let i=0;i<24;i++){
        const el = document.createElement("div");
        el.className = "heart";
        el.textContent = ["💖","💘","💞","💕","❤️","🌷","✨","💐"][Math.floor(Math.random()*8)];
        el.style.left = Math.random()*100 + "vw";
        el.style.animationDuration = (2 + Math.random()*2.8) + "s";
        el.style.fontSize = (16 + Math.random()*20) + "px";
        hearts.appendChild(el);
        setTimeout(()=> el.remove(), 5200);
      }
    }

    yesBtn.addEventListener("click", () => {
      // Message content
      msg.innerHTML = `
        <div style="font-size:18px; font-weight:800; margin-bottom:6px;">
          Yayyy 🥰💞
        </div>
        <div>
          My love, I love you a lot. You are a blessing and lots of adooor to you. 🫶✨
          <br><br>
          Please allow me to take you on a cute date someday. 🌷🍓
          <br><br>
          Tight hugg and kisses my babyboo, my princess, my heart, my love. 💋👑❤️
          <br><br>
          🌸💐✨
        </div>
      `;

      // Show with animation (re-trigger friendly)
      msg.classList.remove("show");
      glow.classList.remove("show");

      // Force reflow so animation restarts cleanly
      void msg.offsetWidth;

      msg.classList.add("show");
      glow.classList.add("show");

      // Lock choices
      noBtn.style.display = "none";
      yesBtn.textContent = "Forever Yes 💚";

      popHearts();
    });
  </script>
</body>
</html>
